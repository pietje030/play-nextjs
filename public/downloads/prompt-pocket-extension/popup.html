<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 400px;
      min-height: 500px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .header {
      padding: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      margin-bottom: 20px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      padding: 0 20px 20px;
    }

    .search-box {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    .search-box::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .prompt-item {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .prompt-item:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .prompt-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .prompt-preview {
      font-size: 12px;
      opacity: 0.8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .prompt-tags {
      margin-top: 8px;
    }

    .tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      margin-right: 4px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: rgba(255, 255, 255, 0.9);
      color: #333;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .stats {
      text-align: center;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      margin-top: 20px;
    }

    .stat-number {
      font-size: 24px;
      font-weight: bold;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">📁 Prompt Pocket</div>
    <div class="subtitle">Your AI prompts, organized</div>
  </div>

  <div class="content">
    <input type="text" class="search-box" placeholder="Search prompts..." id="searchBox">
    
    <div class="actions">
      <button class="btn btn-primary" id="addPrompt">+ Add Prompt</button>
      <button class="btn btn-secondary" id="exportData">Export</button>
    </div>

    <div id="promptsList">
      <div class="prompt-item">
        <div class="prompt-title">Email Subject Lines</div>
        <div class="prompt-preview">Write compelling email subject lines for...</div>
        <div class="prompt-tags">
          <span class="tag">📧 email</span>
          <span class="tag">🎯 marketing</span>
        </div>
      </div>

      <div class="prompt-item">
        <div class="prompt-title">Social Media Copy</div>
        <div class="prompt-preview">Create engaging social media posts...</div>
        <div class="prompt-tags">
          <span class="tag">📱 social</span>
          <span class="tag">✍️ writing</span>
        </div>
      </div>

      <div class="prompt-item">
        <div class="prompt-title">Code Documentation</div>
        <div class="prompt-preview">Generate clear documentation for...</div>
        <div class="prompt-tags">
          <span class="tag">💻 code</span>
          <span class="tag">📖 docs</span>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat-number">127</div>
      <div class="stat-label">Prompts Saved</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
